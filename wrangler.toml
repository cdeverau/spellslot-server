name = "spellslot-server"
main = "src/index.js"
compatibility_date = "2025-09-01"

# .dev.vars overrides these under `wrangler dev` (ALLOWED_ORIGINS="*" there)
[vars]
ALLOWED_ORIGINS = "https://html-classic.itch.zone,https://html.itch.zone"
POOL_CAP = "300"
QUARANTINE_REPORTERS = "2"

[[d1_databases]]
binding = "DB"
database_name = "spellslot-pool"
database_id = "ea616ebf-41e0-4d62-952d-5d3c794dfa0c"

# staging: a separate Worker + database, deployed from the `staging` branch with `wrangler deploy --env staging`.
# Named environments inherit nothing, so vars and bindings are repeated here.
[env.staging]
name = "spellslot-server-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "*"
POOL_CAP = "300"
QUARANTINE_REPORTERS = "2"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "spellslot-pool-staging"
database_id = "cd9e2e94-6705-4253-a4c9-e6a85aad3b46" 

[observability.logs]
enabled = true
invocation_logs = true

